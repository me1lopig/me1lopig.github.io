<header class="site-header">
  <div class="container header-content">
    <a href="{{ '/' | relative_url }}" class="brand" aria-label="Inicio">
      <span class="brand-mark">GLP</span>
      <span class="brand-text">{{ site.title }}</span>
    </a>

    <nav class="site-nav" aria-label="Navegación principal">
      <ul>
        <li><a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Inicio</a></li>
        <li><a href="{{ '/repos/' | relative_url }}" {% if page.url == '/repos/' %}class="active"{% endif %}>Repositorios</a></li>
        <li><a href="{{ '/posts/' | relative_url }}" {% if page.url == '/posts/' %}class="active"{% endif %}>Blog</a></li>
      </ul>
    </nav>

    <button class="mobile-menu-toggle" aria-label="Menú" aria-expanded="false">
      <i class="fas fa-bars"></i>
    </button>
  </div>
</header>

<div class="mobile-menu">
  <nav aria-label="Navegación móvil">
    <ul>
      <li><a href="{{ '/' | relative_url }}">Inicio</a></li>
      <li><a href="{{ '/repos/' | relative_url }}">Repositorios</a></li>
      <li><a href="{{ '/posts/' | relative_url }}">Blog</a></li>
    </ul>
  </nav>
</div>
